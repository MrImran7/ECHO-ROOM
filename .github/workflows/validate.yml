name: Validate Echo Room
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python3 -m pip install Pillow
      - run: python3 tool/validate.py
      - name: Commit formatter output to the active feature branch
        if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/feature/gameplay-core' || github.ref == 'refs/heads/feature/chapter-1' || github.ref == 'refs/heads/feature/game-feel' || github.ref == 'refs/heads/feature/progression')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          if [ -f pubspec.lock ]; then git add pubspec.lock; fi
          if ! git diff --cached --quiet; then
            git commit -m 'style: format Dart source and lock resolved dependencies'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: echo-room-validation
          path: validation-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: echo-room-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter-1-scene-review
          path: build/chapter-review/*.png
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python3 tool/bootstrap.py
      - run: flutter build ios --simulator --debug
